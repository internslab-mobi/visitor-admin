#.\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

vms:
  document:
    nda-upload-dir: D:/VMS/NDA
    upload-dir: D:/VMS/Proof
    photo-upload-dir: D:/VMS/VisitorPhotos


  security:
    cookie:
      secure: ${VMS_COOKIE_SECURE:false}
    hmac:
      blind-index-key: ${VMS_HMAC_BLIND_INDEX_KEY}


qr:
  service:
    base-url: ${QR_SERVICE_BASE_URL:http://localhost:8062}
    api-key: ${QR_SERVICE_API_KEY}

summary-export:
  service:
    export-url: http://localhost:8063


notification:
  service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8094}
  test-recipient: ${NOTIFICATION_TEST_EMAIL}


springdotenv:
  filename: .env-local


jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH}





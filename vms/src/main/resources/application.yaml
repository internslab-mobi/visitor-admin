spring:
  application:
    name: vms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

jwt:
  secret: ${JWT_SECRET}

vms:
  security:
    cookie:
      secure: ${VMS_COOKIE_SECURE:false}
    hmac:
      blind-index-key: ${VMS_HMAC_BLIND_INDEX_KEY}

  document:
    nda-upload-dir: D:/VMS/NDA
    upload-dir: D:/VMS/Proof
    photo-upload-dir: D:/VMS/VisitorPhotos

crypto:
  aes:
    key: ${CRYPTO_AES_KEY}

server:
  port: 8092

logging:
  level:
    root: INFO
    com.adminvisitor: DEBUG
    logging:
      level:
        root: INFO
        com.adminvisitor: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false
qr:
  service:
    base-url: http://localhost:8062

summary-export:
  service:
    export-url: http://localhost:8063

springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: VMS-XSRF-TOKEN
      header-name: X-VMS-XSRF-TOKEN



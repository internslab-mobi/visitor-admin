spring:
  application:
    name: vms-test

  datasource:
    url: jdbc:h2:mem:vms_test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

vms:
  notification:
    host-email: host@example.com
    host-name: Test Host
    department-name: Test Department

server:
  port: 8060
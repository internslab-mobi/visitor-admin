spring:
  application:
    name: QR

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8062

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}






spring:
  application:
    name: auth

server:
  port: 8093

jwt:
  expiration: 900000
  refresh-expiration: 43200000

logging:
  level:
    root: INFO
    com.adminvisitor.auth: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  swagger-ui:
    csrf:
      enabled: true
spring:
  application:
    name: auth

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8093

jwt:
  expiration: 900000
  refresh-expiration: 43200000
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: false

app:
  cors:
    allowed-origin: http://localhost:4200

logging:
  level:
    root: INFO
    com.adminvisitor.auth: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        enabled: false
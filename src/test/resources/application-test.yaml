spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 25
    username: ${MAIL_USERNAME:noreply@adminvisitor.com}
    password: ${MAIL_PASSWORD:password}

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:src/test/resources/jwt/test-private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:src/test/resources/jwt/test-public.pem}
  expiration: 900000
  refresh-expiration: 2700000

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:8094

auth:
  cookie:
    secure: false
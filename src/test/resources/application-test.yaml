spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 25
    username: ${MAIL_USERNAME:noreply@adminvisitor.com}
    password: ${MAIL_PASSWORD:password}

jwt:
  secret: ${JWT_SECRET:TestOnlyJwtSecretKeyForUnitTests123456789012345678901234567890}
  expiration: 900000
  refresh-expiration: 2700000